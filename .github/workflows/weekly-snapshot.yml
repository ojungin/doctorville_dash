name: 주간 회원 스냅샷

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00 KST (00:00 UTC)
  workflow_dispatch: {}    # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 구글시트 집계
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_RANGE: ${{ vars.SHEET_RANGE || '시트1' }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/build.mjs

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 주간 회원 스냅샷 $(date -u +%Y-%m-%d)"
            git push
          fi
